{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Food | Micro Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'styles/css/delete.css' %}">
</head>
<body class="min-h-screen flex flex-col">
<!-- HEADER -->
<header class="max-w-7xl w-full mx-auto px-6 py-7">
    <div class="flex items-center gap-3">
        <div class="logo-box w-11 h-11 rounded-xl flex items-center justify-center text-xl font-extrabold">
            M
        </div>
        <div>
            <h1 class="text-xl font-extrabold tracking-tight">
                MICRO<span style="color:#a3e635">TRACKER</span>
            </h1>
            <p class="text-xs mt-1" style="color:#8492a8">
                Nutrition Dashboard </p>
        </div>
    </div>
</header>
<!-- MAIN -->
<main class="flex-1 flex items-center justify-center px-5 py-12">
    <div class="delete-card w-full max-w-md p-8 md:p-10 text-center">
        <!-- TEXT -->
        <p class="text-xs font-bold tracking-widest mb-3" style="color:#fb7185">
            DELETE CONFIRMATION </p>
        <h2 class="text-2xl font-extrabold mb-4">
            Delete this item? </h2>
        <p class="text-sm leading-7 mb-8" style="color:#8492a8">
            Are you sure you want to delete this item from your food log? <br> <span style="color:#fb7185">
                    This action cannot be undone.
                </span>
        </p>
        <!-- FORM -->
        <form method="post" action="">
            {% csrf_token %}
            <div class="flex flex-col sm:flex-row gap-3">
                <button type="submit" class="delete-btn flex-1">
                    Yes, Delete
                </button>
                <a href="{% url 'main:index' %}" class="cancel-btn flex-1 flex items-center justify-center"> Cancel </a>
            </div>
        </form>
        <p class="text-xs mt-8" style="color:#526176">
            MICRO TRACKER · Manage your nutrition </p>
    </div>
</main>
</body>
</html>
